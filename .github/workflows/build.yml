name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lock Android NDK Version
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust and Cargo APK
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-apk

      - name: Install Missing Android Platform
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30"

      - name: Force Horizontal Mode
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/g' {} + || true

      - name: Update Dependencies
        run: cargo update

      - name: Compile and Package APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo apk build --release -p effectcraft

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: target/**/*.apk
