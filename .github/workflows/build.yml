name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Lock Android NDK Version
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Force Horizontal Mode
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/g' {} +

      - name: Update Dependencies
        run: cargo update

      - name: Compile the App
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-apk
          path: target/**/*.apk
